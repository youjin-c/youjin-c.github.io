<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="https://www.linkedin.com/in/youjin-chung/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://github.com/youjin-c" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  {% assign current_project = site.data.projects | where: "title", page.title | first %}

  <main class="site-content">
    <article class="project-page">
      <a href="{{ '/' | relative_url }}" class="back-link">Back to Work</a>
      <h1 class="project-title">{{ page.title }}</h1>
      {% if current_project.date %}
      <div class="project-date-header">{{ current_project.date }}</div>
      {% endif %}
      <div class="project-content">
        {{ content }}
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</p>
  </footer>
</body>
</html>
